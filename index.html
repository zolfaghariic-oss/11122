<!DOCTYPE html>
<html lang="en" class=""><head><script>window.livecodes = window.livecodes || {};</script><title>DeepAI Code Snippet</title><meta name="title" content="DeepAI Code Snippet"><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"><link rel="stylesheet" href="./style.css"><script src="https://cdn.jsdelivr.net/npm/es-module-shims@1.10.0/dist/es-module-shims.js" async=""></script><script type="importmap">{
  "imports": {}
}</script></head><body>


  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>آپلود فایل به Google Drive</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 620px; margin: 10vh auto; padding: 24px; }
    .box { border: 2px dashed #aaa; border-radius: 16px; padding: 32px; text-align: center; }
    button { padding: 10px 18px; cursor: pointer; }
    #status { margin-top: 16px; overflow-wrap: anywhere; }
  </style>


  <h1>آپلود فایل</h1>
  <div class="box">
    <input id="file" type="file">
    <p><button id="upload">آپلود به Google Drive</button></p>
    <progress id="progress" value="0" max="100" hidden=""></progress>
    <div id="status" aria-live="polite"></div>
  </div>

  <script>
    // این آدرس را با آدرس بک‌اند واقعی خودتان جایگزین کنید.
    const API_URL = "https://YOUR-BACKEND.example.com/api/upload";

    const input = document.querySelector("#file");
    const button = document.querySelector("#upload");
    const status = document.querySelector("#status");
    const progress = document.querySelector("#progress");

    button.addEventListener("click", async () => {
      const file = input.files[0];
      if (!file) {
        status.textContent = "ابتدا یک فایل انتخاب کنید.";
        return;
      }

      button.disabled = true;
      progress.hidden = false;
      progress.value = 0;
      status.textContent = "در حال آپلود…";

      try {
        const form = new FormData();
        form.append("file", file);

        // برای نمایش پیشرفت واقعی، بک‌اند باید آپلود چندبخشی/قابل‌پیگیری داشته باشد.
        const response = await fetch(API_URL, {
          method: "POST",
          body: form
        });

        const result = await response.json();
        if (!response.ok) throw new Error(result.error || "آپلود ناموفق بود.");

        progress.value = 100;
        status.innerHTML = "";
        const link = document.createElement("a");
        link.href = result.downloadUrl;
        link.textContent = "باز کردن لینک دانلود";
        link.target = "_blank";
        link.rel = "noopener noreferrer";
        status.append("آپلود انجام شد: ", link);
      } catch (error) {
        status.textContent = "خطا: " + error.message;
      } finally {
        button.disabled = false;
      }
    });
  </script>

<script src="./script.js"></script></body></html>
